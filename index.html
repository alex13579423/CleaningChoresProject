<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח תורנויות</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6750A4">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas#app {
            width: 100%;
            height: 100%;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #loading {
            position: absolute;
            font-family: sans-serif;
            text-align: center;
            direction: rtl;
        }
    </style>
</head>
<body>
    <div id="loading">מתחיל את האפליקציה...</div>
    <!-- Note: Must be a canvas element for CanvasBasedWindow -->
    <canvas id="app"></canvas>

    <script src="composeApp.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js');
            });
        }

        // Safety check: remove loading if app doesn't start in 10s
        setTimeout(() => {
            const loader = document.getElementById('loading');
            if (loader) loader.innerText = "טוען... (אם זה לוקח זמן רב, נסה לרענן)";
        }, 10000);
    </script>
</body>
</html>
