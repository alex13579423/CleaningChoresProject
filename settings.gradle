pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        
        // Repository for Node.js
        ivy {
            url = "https://nodejs.org/dist"
            patternLayout {
                artifact("v[revision]/[artifact]-v[revision]-[classifier].[ext]")
            }
            metadataSources {
                artifact()
            }
        }
        
        // Repository for Yarn
        ivy {
            url = "https://github.com/yarnpkg/yarn/releases/download"
            patternLayout {
                artifact("v[revision]/[artifact]-v[revision].[ext]")
            }
            metadataSources {
                artifact()
            }
        }
    }
}
rootProject.name = "CleaningChoresProject"
include ':app'
