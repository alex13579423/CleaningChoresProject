name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - feat/apple-support

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          
      - name: Execute Gradle Build
        run: gradle :app:wasmJsBrowserDistribution --no-configuration-cache --no-parallel --stacktrace

      - name: Prepare Deployment Folder
        run: |
          mkdir -p deploy
          
          # Find the actual output directory
          DIST_DIR=$(find . -path "*/build/dist/wasmJs/productionExecutable" -type d | head -n 1)
          
          if [ -n "$DIST_DIR" ]; then
            echo "Found distribution directory at $DIST_DIR"
            cp -rv $DIST_DIR/* deploy/
          else
            echo "Production executable not found, attempting fallback search..."
            find . -name "*.js" -path "*/build/dist/*" -exec cp -v {} deploy/ \;
            find . -name "*.wasm" -path "*/build/dist/*" -exec cp -v {} deploy/ \;
            find . -name "*.mjs" -path "*/build/dist/*" -exec cp -v {} deploy/ \;
          fi
          
          # Copy static web assets (index.html, manifest.json, etc.)
          if [ -d "web" ]; then
            cp -rv web/* deploy/
          fi
          
          # Ensure .nojekyll exists
          touch deploy/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
