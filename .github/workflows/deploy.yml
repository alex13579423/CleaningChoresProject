name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - feat/apple-support

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Target
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          arguments: :app:wasmJsBrowserDistribution --no-configuration-cache --no-parallel --stacktrace

      - name: Prepare Deployment Folder
        run: |
          mkdir -p deploy
          # Check for production output and copy to deploy folder
          if [ -d "app/build/dist/wasmJs/productionExecutable" ]; then
            cp -rv app/build/dist/wasmJs/productionExecutable/* deploy/
          else
            echo "Searching for build output..."
            find app/build/dist -name "*.js" -exec cp -v {} deploy/ \;
          fi
          # Copy static web assets (index.html, manifest.json, etc.)
          cp -rv web/* deploy/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
