name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"] # Updated to your branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './pwa/package-lock.json' # Points cache to your subfolder

      - name: Install dependencies
        working-directory: ./pwa # Added working directory
        run: npm install

      - name: Build
        working-directory: ./pwa # Added working directory
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pwa/dist' # Updated to your output folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4