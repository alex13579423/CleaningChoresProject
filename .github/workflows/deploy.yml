name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - feat/apple-support

# FIX 1: Grant permissions so the action can actually push to gh-pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          
      - name: Execute Gradle Build
        # VERIFIED LOCALLY: This command now succeeds with Kotlin 1.9.24 + Compose 1.6.11
        run: gradle :app:wasmJsBrowserDistribution --no-configuration-cache --no-parallel --stacktrace

      - name: Prepare Deployment Folder
        run: |
          mkdir -p deploy
          
          # Search for production output and copy to deploy folder
          find . -path "*/build/dist/wasmJs/productionExecutable" -type d -exec cp -rv {}/. deploy/ \;
          
          if [ -z "$(ls -A deploy)" ]; then
             echo "Standard productionExecutable folder not found, searching for any .js output..."
             find . -name "*.js" -path "*/build/dist/*" -exec cp -v {} deploy/ \;
          fi
          
          # Copy static web assets (index.html, manifest.json, etc.)
          if [ -d "web" ]; then
            cp -rv web/* deploy/
          fi
          
          # Prevent GitHub Pages from ignoring critical framework files
          touch deploy/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
