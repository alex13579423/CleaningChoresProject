name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - feat/apple-support

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate and Fix Gradle Wrapper
        run: |
          # If gradlew is missing, install gradle and generate the wrapper
          if [ ! -f gradlew ]; then
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Web Target
        run: ./gradlew wasmJsBrowserDistribution

      - name: Prepare Deployment Folder
        run: |
          mkdir deploy
          cp -r build/dist/wasmJs/productionExecutable/* deploy/
          cp -r web/* deploy/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
