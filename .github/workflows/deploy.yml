name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - feat/apple-support

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Web Target
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew wasmJsBrowserDistribution
          else
            echo "Gradlew not found, using system gradle"
            gradle wasmJsBrowserDistribution
          fi

      - name: Prepare Deployment Folder
        run: |
          mkdir deploy
          cp -r build/dist/wasmJs/productionExecutable/* deploy/
          cp -r web/* deploy/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
